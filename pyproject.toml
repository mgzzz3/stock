[project]
name = "stock"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "tushare>=1.4",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "truststore>=0.10",
    "tqdm>=4.66",
    "akshare>=1.18.60",
    "beautifulsoup4>=4.14",
    "lxml>=5.0",
    "mini-racer>=0.14; sys_platform != 'linux'",
    "py-mini-racer>=0.6; sys_platform == 'linux'",
    "requests>=2.32",
]

[tool.uv]
package = false
